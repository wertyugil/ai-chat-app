<!DOCTYPE html>
<html>
<head><title>Chat DeepSeek</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;margin:0;background:#f0f0f0}
#header{background:#1a73e8;color:white;padding:15px;text-align:center;font-size:20px}
#messages{height:75vh;overflow-y:auto;padding:10px}
.user{background:#1a73e8;color:white;padding:10px;border-radius:15px 15px 0 15px;margin:5px 0;max-width:80%;float:right;clear:both}
.ai{background:white;padding:10px;border-radius:15px 15px 15px 0;margin:5px 0;max-width:80%;float:left;clear:both}
#input-area{display:flex;padding:10px;background:white;position:fixed;bottom:0;width:100%;box-sizing:border-box}
#msg{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;outline:none}
#send{background:#1a73e8;color:white;border:none;padding:10px 20px;border-radius:20px;margin-left:5px}
</style></head>
<body>
<div id=header>🤖 Chat DeepSeek</div>
<div id=messages></div>
<div id=input-area>
<input id=msg placeholder="Ketik pesan..." onkeypress="if(event.key===Enter)send()">
<button id=send onclick=send()>Kirim</button>
</div>
<script>
function send(){
    var msg = document.getElementById("msg").value;
    addMsg(msg, "user");
    document.getElementById("msg").value = "";
    addMsg("⏳ Mengetik...", "ai");
    fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:msg})})
    .then(r=>r.json()).then(d=>{
        document.querySelector(".ai:last-child").innerHTML = d.reply;
    });
}
function addMsg(text, cls){
    var div = document.createElement("div");
    div.className = cls;
    div.innerHTML = text;
    document.getElementById("messages").appendChild(div);
}
</script>
</body></html>
